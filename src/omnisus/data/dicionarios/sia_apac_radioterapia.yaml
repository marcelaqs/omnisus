          locator: 'APAC_Radioterapia.DEF, linhas 411-412: AP_COIDADE, 1, CNV/IDADEDET.CNV e CNV/IDADE18.CNV'
        note: 'Medido, não lido (issue ap_coidade-sem-tabela). Os CNV leem 3 caracteres, AP_COIDADE seguido de AP_NUIDADE; nenhuma tabela rotula o código de 1 caractere.'
      issues:
      - id: ap_coidade-sem-tabela
        status: open
        description: '''0'', se aparecer, fica sem rótulo, e ''2'', ''3'', ''4'' e ''5'' foram medidos, não lidos: nenhuma tabela rotula o código de 1 caractere. IDADEDET.CNV e IDADE18.CNV (TAB_SIA),
          ligados a AP_COIDADE em todos os DEF de APAC, leem 3 caracteres, AP_COIDADE seguido de AP_NUIDADE:
          ''000'' é ''Idade inválida'' e 500 a 530 são 100 a 130 anos, e por isso ''5'' é ''Anos (somar 100)''. O Informe Técnico SIASUS 2019-07
          descreve AP_COIDADE (CHAR 1, ''Código da Idade'') sem códigos (pp. 6-14). O mapa é o de AQ: APAC_Radioterapia.DEF
          (linhas 411-412) liga AP_COIDADE aos mesmos IDADEDET.CNV e IDADE18.CNV que APAC_Quimioterapia.DEF
          (linhas 416-417).'
