      issues:
      - id: uf_zi-faixa-em-codigo-longo
        status: resolved
        description: 'br_municgestor.cnv (TAB_SIH, sih-tab-21e42384645a) declara códigos de 6 caracteres e escreve faixas em três linhas: Rio de Janeiro (334501-334530), São Paulo (358001-358058) e Distrito Federal (530000-530009 e 530011-539999). O TabWin.pdf (pp. 90-91) documenta a faixa só para variáveis de até 4 caracteres e diz que, no código longo, os valores "somente poderão ser separados por vírgulas". O mapa expande essas faixas como as de qualquer tabela: 10.087 das 15.731 chaves recebem rótulo só por elas. As fixtures do RD e do RJ publicam 140000, 140010, 350390, 352470 e 354130, todas listadas uma a uma na tabela. Os arquivos RD do Distrito Federal lidos publicam uma chave que só a faixa alcança: 530000 em todos os 76.276 registros dos cinco arquivos RDDF (janeiro de 2008, 2012, 2016, 2020 e 2024, evidence/2026-11-18-rd-medidas). Sem a faixa 530000-530009, todos esses registros ficariam sem rótulo. A medida é do RD: nenhum arquivo RJ do Distrito Federal foi lido. Resolvido em 2026-11-18 (issue #182): o mapa expande as faixas também em código longo, porque segue a tabela como publicada e a faixa 530000-530009 é a única referência ao código que os arquivos RDDF lidos publicam.'
